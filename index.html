<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>日晷设计系统 · Sundial Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>日晷设计系统</h1>
        <span class="subtitle">TypeScript + WebGL2 · 天文历表级刻线精度 0.5 mm</span>
      </header>

      <main class="layout">
        <aside class="panel controls">
          <section class="group">
            <h2>地点</h2>
            <label>预设城市
              <select id="citySelect"></select>
            </label>
            <div class="grid2">
              <label>纬度 °
                <input id="latInput" type="number" step="0.0001" min="-90" max="90" />
              </label>
              <label>经度 °
                <input id="lonInput" type="number" step="0.0001" min="-180" max="180" />
              </label>
            </div>
          </section>

          <section class="group">
            <h2>晷型</h2>
            <div class="seg" id="typeSeg">
              <button data-type="horizontal" class="active">水平式</button>
              <button data-type="equatorial">赤道式</button>
              <button data-type="wall">墙面式</button>
            </div>
            <div id="wallControls" class="wall-controls" hidden>
              <label>墙面朝向方位角 ° (北0 东90 南180 西270)
                <input id="wallAz" type="number" step="0.1" value="180" />
              </label>
              <label>墙面倾角 ° (0=竖直, 90=水平朝天)
                <input id="wallTilt" type="number" step="0.1" value="0" min="0" max="90" />
              </label>
              <div class="hint" id="wallDeclHint"></div>
            </div>
          </section>

          <section class="group">
            <h2>晷面与晷针</h2>
            <label>晷面半径 (mm)
              <input id="radiusInput" type="number" step="10" value="300" min="50" max="1000" />
            </label>
            <label>晷针厚度 (mm)
              <input id="thickInput" type="number" step="0.5" value="4" min="0" max="50" />
            </label>
            <label>晷针长度 (mm, 0=自动)
              <input id="lenInput" type="number" step="5" value="0" min="0" />
            </label>
            <label>影子读数边
              <select id="edgeSelect">
                <option value="center">中心线 (理想细针)</option>
                <option value="leading">向日边 (本影外缘)</option>
                <option value="trailing">背日边</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="analemmaChk" checked /> 刻均时差 8 字线</label>
          </section>

          <section class="group">
            <h2>三维投影时刻</h2>
            <div class="grid2">
              <label>日序 (1-366)
                <input id="doyInput" type="number" step="1" value="172" min="1" max="366" />
              </label>
              <label>本地小时
                <input id="hourInput" type="number" step="0.25" value="12" min="0" max="24" />
              </label>
            </div>
            <div class="anim-row">
              <button id="playBtn">▶ 全年播放</button>
              <label>遍历秒数
                <input id="yearSec" type="number" step="1" value="24" min="2" max="120" />
              </label>
            </div>
            <div class="hint" id="sunInfo"></div>
          </section>

          <section class="group">
            <h2>显示</h2>
            <label class="check"><input type="checkbox" id="showHour" checked /> 时线</label>
            <label class="check"><input type="checkbox" id="showTerm" checked /> 节气线</label>
            <label class="check"><input type="checkbox" id="showLabel" checked /> 文字标注</label>
          </section>

          <section class="group metrics">
            <h2>计算结果</h2>
            <div id="metrics"></div>
          </section>
        </aside>

        <section class="panel viewport">
          <div class="view-tabs">
            <button data-view="face" class="active">晷面刻线 (2D)</button>
            <button data-view="scene">三维投影场景</button>
          </div>
          <div class="canvas-wrap">
            <canvas id="faceCanvas" class="view active"></canvas>
            <canvas id="sceneCanvas" class="view"></canvas>
            <div class="legend" id="legend"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
